<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autenticación - Gimnasio ETP Xavier</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- Botón para volver al inicio -->
  <a href="index.html" class="back-button">Inicio</a>
  <div class="auth-page">
    <div class="auth-container">
      <div class="tabs">
        <button id="loginTab" class="tab active">Iniciar Sesión</button>
        <button id="registerTab" class="tab">Registrarse</button>
      </div>
      <div class="forms">
        <form id="loginForm" class="form active">
          <h2>Iniciar Sesión</h2>
          <input type="email" name="email" placeholder="Correo Electrónico" required />
          <input type="password" name="password" placeholder="Contraseña" required />
          <button type="submit">Entrar</button>
        </form>
        <form id="registerForm" class="form">
          <h2>Registrarse</h2>
          <input type="text" name="name" placeholder="Nombre" required />
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Contraseña" required />
          <select name="level" required>
            <option value="basico">Básico</option>
            <option value="intermedio">Intermedio</option>
            <option value="experto">Experto</option>
          </select>
          <button type="submit">Registrarse</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Se incluye el script externo -->
  <script src="js/auth.js"></script>
</body>
</html>
