<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - Gimnasio ETP Xavier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <button id="menuToggle" class="menu-toggle">Menú</button>
      <div class="nav-center">
        <div class="logo">Gimnasio ETP Xavier</div>
      </div>
      <div class="nav-right">
        <a href="auth.html" class="btn auth-btn">Iniciar Sesión</a>
      </div>
    </nav>
  </header>
  
  <!-- Carrusel con video de fondo -->
  <section id="inicio" class="carousel">
    <!-- Video de fondo -->
    <video class="carousel-video" autoplay loop muted playsinline>
      <source src="https://synergym.es/wp-content/uploads/2023/03/Video-Mix-Home-SYNERGYM-1-1.mp4" type="video/mp4">
      Tu navegador no soporta el elemento video.
    </video>
    
    <!-- Contenido del carrusel -->
    <div class="carousel-content">
      <!-- Se muestran uno a la vez; se alternarán con el JS -->
      <div class="slide-content">
        <h2>Tienda</h2>
        <p>Explora nuestros productos y suplementos</p>
        <a href="servicios/tienda.html" class="btn">Ver Tienda</a>
      </div>
      <div class="slide-content">
        <h2>Programas</h2>
        <p>Descubre entrenamientos y planes de nutrición</p>
        <a href="servicios/programas.html" class="btn">Ver Programas</a>
      </div>
      <div class="slide-content">
        <h2>Subscripciones</h2>
        <p>Elige tu plan de membresía</p>
        <a href="servicios/subscripciones.html" class="btn">Ver Subscripciones</a>
      </div>
    </div>
    
    <!-- Controles del carrusel -->
    <div class="carousel-controls">
      <button id="prevBtn">&#10094;</button>
      <button id="nextBtn">&#10095;</button>
    </div>
  </section>
  
  <!-- Script para controlar el carrusel -->
  <script>
    // Selecciona todos los slides
    let currentSlide = 0;
    const slides = document.querySelectorAll('.carousel-content .slide-content');
    const totalSlides = slides.length;
    
    // Función para mostrar el slide actual y ocultar los demás
    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.style.display = (i === index) ? 'block' : 'none';
      });
    }
    
    // Inicializa mostrando el primer slide
    showSlide(currentSlide);
    
    // Botones de control
    document.getElementById('nextBtn').addEventListener('click', () => {
      currentSlide = (currentSlide + 1) % totalSlides;
      showSlide(currentSlide);
    });
    
    document.getElementById('prevBtn').addEventListener('click', () => {
      currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
      showSlide(currentSlide);
    });
    
    // Cambio automático (opcional)
    setInterval(() => {
      currentSlide = (currentSlide + 1) % totalSlides;
      showSlide(currentSlide);
    }, 7000);
  </script>
</body>
</html>
